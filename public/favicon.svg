<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Yellow radial gradient: bright center-top, golden mid, deeper gold edge -->
    <radialGradient id="yg" cx="50%" cy="28%" r="72%" fx="50%" fy="10%">
      <stop offset="0%"   stop-color="#fff5a0"/>
      <stop offset="30%"  stop-color="#ffe033"/>
      <stop offset="68%"  stop-color="#f5b800"/>
      <stop offset="100%" stop-color="#c98a00"/>
    </radialGradient>
    <!-- Subtle inner gloss highlight -->
    <radialGradient id="gl" cx="50%" cy="18%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circ">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>

  <!-- Outer circle background -->
  <circle cx="256" cy="256" r="248" fill="url(#yg)"/>

  <!-- White umbrella shape, clipped to circle -->
  <g clip-path="url(#circ)">
    <!--
      Canopy: large semicircle from left edge to right edge of umbrella,
      centred around 256,230. The canopy outer arc has radius ~168.
      Scalloped bottom: 4 bumps (3 full + 2 halves at edges).
      Each bump is an upward arc (concave cutout in the yellow).
    -->
    <path d="
      M  88 240
      A 168 168 0 0 1 424 240
      Q 406 210 388 240
      Q 368 210 344 240
      Q 320 210 296 240
      Q 276 210 256 240
      Q 236 210 216 240
      Q 192 210 168 240
      Q 144 210 120 240
      Q 104 210  88 240
      Z
    " fill="white"/>

    <!-- Stem: vertical bar down from canopy centre -->
    <rect x="242" y="240" width="28" height="108" rx="14" fill="white"/>

    <!-- Hook: curves left at the bottom -->
    <path d="M 242 340 Q 242 400 204 400 Q 172 400 172 372 Q 172 356 188 350"
          fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top knob -->
    <circle cx="256" cy="110" r="18" fill="white"/>
  </g>

  <!-- Gloss overlay -->
  <circle cx="256" cy="256" r="248" fill="url(#gl)"/>
</svg>
