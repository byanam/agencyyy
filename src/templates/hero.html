<!-- Hero Section Template -->
<section class="figma-hero-section" id="hero">
  <div class="hero-base-clouds-wrap">
    <img src="/images/figma/hero_base_clouds.webp" alt="Storm Clouds Atmosphere" class="hero-base-clouds-img" width="2241" height="856" fetchpriority="high" />
  </div>
  <div class="hero-headline-wrap">
    <h1 class="hero-headline" aria-label="legendary Agency">
      <img src="/images/figma/hero_headline_text.webp" alt="legendary Agency" class="hero-headline-img" width="979" height="486" fetchpriority="high" />
      <span class="sr-only">legendary Agency</span>
    </h1>
  </div>
  <canvas id="hero-rain-canvas" class="hero-rain-canvas"></canvas>
  <div class="hero-top-clouds-wrap">
    <img src="/images/figma/hero_top_clouds.webp" alt="Foreground Storm Clouds" class="hero-top-clouds-img" width="1891" height="701" fetchpriority="high" />
  </div>
  <div class="hero-umbrella-container" id="umbrella-wrap">
    <img src="/images/figma/hero_umbrella.webp" alt="Yellow Umbrella" class="hero-umbrella-img" width="1148" height="980" fetchpriority="high" />
  </div>
  <div class="hero-subblocks-container">
    <div class="hero-subblock hero-subblock-left">
      <img src="/images/figma/hero_left_subblock.webp" alt="First impressions are expensive to get wrong." class="hero-subblock-img" width="541" height="273" />
    </div>
    <div class="hero-subblock hero-subblock-right">
      <img src="/images/figma/hero_right_subblock.webp" alt="Building high-impact digital experiences since 2022." class="hero-subblock-img" width="543" height="286" />
    </div>
  </div>
</section>
